<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06142a">
  <meta name="description" content="Convite especial dos 15 anos da Marcella. 27 de fevereiro de 2027, às 20h.">
  <link rel="canonical" href="https://premium-invites.github.io/Convite-Marcella-15-anos/">
  <link rel="image_src" href="https://premium-invites.github.io/Convite-Marcella-15-anos/assets/preview-whatsapp.jpg">

  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Convite Marcella — 15 anos">
  <meta property="og:url" content="https://premium-invites.github.io/Convite-Marcella-15-anos/">
  <meta property="og:title" content="Marcella — 15 anos">
  <meta property="og:description" content="27/02/2027 às 20h. Clique para abrir o convite.">
  <meta property="og:image" content="https://premium-invites.github.io/Convite-Marcella-15-anos/assets/preview-whatsapp.jpg">
  <meta property="og:image:secure_url" content="https://premium-invites.github.io/Convite-Marcella-15-anos/assets/preview-whatsapp.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Convite de 15 anos da Marcella em azul-marinho e dourado">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marcella — 15 anos">
  <meta name="twitter:description" content="27/02/2027 às 20h. Clique para abrir o convite.">
  <meta name="twitter:image" content="https://premium-invites.github.io/Convite-Marcella-15-anos/assets/preview-whatsapp.jpg">

  <title>Marcella — 15 anos</title>
  <link rel="preload" href="assets/opening.webp" as="image">
  <link rel="preload" href="assets/principal.webp" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="inviteApp">
    <section class="screen active" id="openingScreen" aria-label="Abertura do convite" style="--screen-bg:url('assets/opening.webp')">
      <div class="stage">
        <img class="art" src="assets/opening.webp" alt="Envelope azul-marinho com laço e joia azul">
        <button class="opening-action" id="openInvite" type="button">TOQUE PARA ABRIR</button>
      </div>
    </section>

    <section class="screen" id="mainScreen" aria-label="Convite principal" style="--screen-bg:url('assets/principal.webp')">
      <div class="stage" id="mainStage">
        <img class="art" src="assets/principal.webp" alt="Convite de 15 anos da Marcella, 27 de fevereiro de 2027 às 20h">
        <button class="hotspot" type="button" data-key="confirm" aria-label="Confirmar presença"></button>
        <button class="hotspot" type="button" data-key="location" aria-label="Abrir localização"></button>
        <button class="hotspot" type="button" data-key="gifts" aria-label="Ver sugestões de presentes"></button>
        <button class="hotspot" type="button" data-key="dress" aria-label="Ver dress code"></button>
        <button class="hotspot" type="button" data-key="manual" aria-label="Ver manual do convidado"></button>
      </div>
    </section>

    <section class="screen" id="giftsScreen" aria-label="Sugestões de presentes" style="--screen-bg:url('assets/presentes.webp')">
      <div class="stage">
        <img class="art" src="assets/presentes.webp" alt="Sugestões de presentes da Marcella">
        <button class="hotspot back-hotspot" type="button" data-key="backGifts" aria-label="Voltar para a página inicial"></button>
      </div>
    </section>

    <section class="screen" id="dressScreen" aria-label="Dress Code" style="--screen-bg:url('assets/dresscode.webp')">
      <div class="stage">
        <img class="art" src="assets/dresscode.webp" alt="Dress Code: esporte fino; evitar azul-marinho e rosa">
        <button class="hotspot back-hotspot" type="button" data-key="backDress" aria-label="Voltar para a página inicial"></button>
      </div>
    </section>

    <section class="screen" id="manualScreen" aria-label="Manual do Convidado" style="--screen-bg:url('assets/manual.webp')">
      <div class="stage">
        <img class="art" src="assets/manual.webp" alt="Manual do Convidado da Marcella; celebração às 20h">
        <button class="hotspot back-hotspot" type="button" data-key="backManual" aria-label="Voltar para a página inicial"></button>
      </div>
    </section>
  </main>

  <button class="edit-open" id="editOpen" type="button">Editar áreas</button>

  <aside class="editor-panel" id="editorPanel" hidden aria-label="Editor de áreas do convite">
    <div class="editor-head">
      <strong>Editor do convite</strong>
      <button id="closeEditor" type="button" class="small-button">Fechar</button>
    </div>
    <p class="editor-help">Escolha uma área no menu ou toque em uma marcação no convite. Arraste para mover e use a alça para redimensionar.</p>
    <div class="editor-grid">
      <label class="wide">Área
        <select id="areaSelect">
          <option value="confirm">Confirmar presença</option>
          <option value="location">Localização</option>
          <option value="gifts">Sugestões de presentes</option>
          <option value="dress">Dress Code</option>
          <option value="manual">Manual do Convidado</option>
          <option value="backGifts">Voltar — Presentes</option>
          <option value="backDress">Voltar — Dress Code</option>
          <option value="backManual">Voltar — Manual</option>
        </select>
      </label>
      <label>Esquerda (%) <input id="leftInput" type="number" min="0" max="100" step="0.1"></label>
      <label>Topo (%) <input id="topInput" type="number" min="0" max="100" step="0.1"></label>
      <label>Largura (%) <input id="widthInput" type="number" min="1" max="100" step="0.1"></label>
      <label>Altura (%) <input id="heightInput" type="number" min="1" max="100" step="0.1"></label>
      <label class="wide">Rótulo no editor <input id="labelInput" type="text"></label>
      <label class="wide visibility"><input id="visibleInput" type="checkbox"> Mostrar este botão no convite publicado</label>
    </div>
    <div class="editor-actions">
      <button id="saveLocal" type="button">Salvar neste navegador</button>
      <button id="copyConfig" type="button">Copiar configuração</button>
      <button id="resetAreas" type="button">Restaurar padrão</button>
    </div>
    <textarea id="exportCode" readonly aria-label="Configuração para copiar"></textarea>
    <p class="editor-status" id="editorStatus" role="status"></p>
  </aside>
  <noscript>Ative o JavaScript para abrir o convite interativo.</noscript>
</body>
</html>
